[project]
name = "nanbeige-fast"
version = "0.2.0"
description = "Local Apple Silicon inference for the Nanbeige4.2 6-bit checkpoint"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mlx==0.32.4",
    "mlx-lm==0.32.2",
    "huggingface-hub==2.4.0",
    "numpy==2.5.5",
    "transformers==5.23.0",
]

[project.optional-dependencies]
dspark = ["mlx-dspark==0.20.4"]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
